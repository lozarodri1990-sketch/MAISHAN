<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAISHAN INDUMENTARIA & ESTILO - Catálogo & Control de Stock</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header con la marca */
    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
      text-align: center;
    }

    @media (min-width: 600px) {
      header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        text-align: left;
      }
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--primary);
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .header-btns {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
      flex: 1;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-outline {
      background: white;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    /* Filtros */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (min-width: 600px) {
      .controls {
        flex-direction: row;
      }
    }

    .search-input {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: white;
      outline: none;
      width: 100%;
    }

    /* Grid de Catálogo */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .product-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #f1f5f9;
    }

    .product-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .variants-summary {
      background: #f8fafc;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border: 1px dashed var(--border);
    }

    .variant-tag {
      display: inline-block;
      background: white;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      margin: 2px;
      font-weight: 600;
    }

    .stock-badge {
      align-self: start;
      margin-top: auto;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .in-stock {
      background-color: var(--success-bg);
      color: var(--success-text);
    }

    .out-stock {
      background-color: var(--danger-bg);
      color: var(--danger-text);
    }

    /* Modales */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
      visibility: hidden;
      opacity: 0;
      transition: all 0.2s ease;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal {
      background: white;
      padding: 20px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 14px;
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .matrix-table th, .matrix-table td {
      padding: 8px;
      text-align: center;
      border: 1px solid var(--border);
      font-size: 0.8rem;
    }

    .matrix-table th {
      background: #f1f5f9;
      font-weight: 700;
    }

    .matrix-table input {
      width: 60px;
      text-align: center;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">MAISHAN</div>
      <div class="brand-subtitle">INDUMENTARIA & ESTILO</div>
    </div>
    <div class="header-btns">
      <button class="btn btn-outline" id="btnAdmin">⚙️ Inventario</button>
      <button class="btn btn-primary" id="btnAdd">➕ Nuevo Producto</button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar por prenda, color o talle...">
  </div>

  <main class="catalog-grid" id="catalogGrid"></main>

  <!-- Modal Nuevo Producto con Matriz -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h2>Cargar Producto (Talles & Colores)</h2>
      <form id="productForm">
        <div class="form-group">
          <label>Nombre del Producto</label>
          <input type="text" id="prodName" required placeholder="Ej. Remera Básica M/C">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Precio ($)</label>
            <input type="number" id="prodPrice" required placeholder="15000">
          </div>
          <div class="form-group">
            <label>Link Foto (Opcional)</label>
            <input type="url" id="prodImg" placeholder="https://...">
          </div>
        </div>

        <div class="form-group">
          <label>Colores (separados por coma)</label>
          <input type="text" id="prodColores" required placeholder="Ej. Negro, Blanco, Rojo">
        </div>

        <div class="form-group">
          <label>Talles (separados por coma)</label>
          <input type="text" id="prodTalles" required placeholder="Ej. S, M, L, XL, XXL">
        </div>

        <button type="button" class="btn btn-outline" id="btnGenerateMatrix" style="width: 100%; margin-top: 8px;">
          ⚡ Generar Tabla de Cantidades
        </button>

        <div id="matrixContainer" style="margin-top: 14px;"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="btnCancelProduct">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnSaveProduct" style="display: none;">Guardar en Catálogo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Admin Inventario -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <h2>MAISHAN - Control de Stock</h2>
      <div id="adminStockList" style="max-height: 400px; overflow-y: auto;"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="btnCloseAdmin">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    const initialProducts = [
      {
        id: 1,
        name: 'Remera Oversize Algodón',
        price: 18000,
        img: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500',
        colores: ['Negro', 'Blanco', 'Gris'],
        talles: ['S', 'M', 'L', 'XL', 'XXL'],
        stockMatrix: {
          'Negro': { 'S': 3, 'M': 5, 'L': 4, 'XL': 2, 'XXL': 0 },
          'Blanco': { 'S': 2, 'M': 4, 'L': 6, 'XL': 3, 'XXL': 1 },
          'Gris': { 'S': 0, 'M': 2, 'L': 3, 'XL': 1, 'XXL': 0 }
        }
      }
    ];

    let products = JSON.parse(localStorage.getItem('maishan_catalog_products')) || initialProducts;

    function saveProducts() {
      localStorage.setItem('maishan_catalog_products', JSON.stringify(products));
      renderCatalog();
    }

    function getTotalStock(matrix) {
      let total = 0;
      for (let color in matrix) {
        for (let talle in matrix[color]) {
          total += parseInt(matrix[color][talle]) || 0;
        }
      }
      return total;
    }

    function renderCatalog() {
      const grid = document.getElementById('catalogGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = products.filter(p => p.name.toLowerCase().includes(search));

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><p>No hay productos cargados.</p></div>`;
        return;
      }

      filtered.forEach(p => {
        const totalStock = getTotalStock(p.stockMatrix);
        const defaultImg = 'https://via.placeholder.com/300x200?text=MAISHAN';
        
        let variantsHTML = '';
        p.colores.forEach(c => {
          variantsHTML += `<div><strong>${c}:</strong> `;
          p.talles.forEach(t => {
            const cant = p.stockMatrix[c] ? p.stockMatrix[c][t] || 0 : 0;
            variantsHTML += `<span class="variant-tag">${t}: ${cant}u</span> `;
          });
          variantsHTML += `</div>`;
        });

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.img || defaultImg}" alt="${p.name}" class="product-img" onerror="this.src='${defaultImg}'">
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="product-price">$${Number(p.price).toLocaleString('es-AR')}</div>
            <div class="variants-summary">
              ${variantsHTML}
            </div>
            <div class="stock-badge ${totalStock > 0 ? 'in-stock' : 'out-stock'}">
              ${totalStock > 0 ? `Stock Total: ${totalStock} u.` : 'Agotado'}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('btnGenerateMatrix').onclick = () => {
      const coloresRaw = document.getElementById('prodColores').value;
      const tallesRaw = document.getElementById('prodTalles').value;

      if (!coloresRaw || !tallesRaw) {
        alert('Por favor completá los colores y los talles separados por coma.');
        return;
      }

      const colores = coloresRaw.split(',').map(c => c.trim()).filter(c => c);
      const talles = tallesRaw.split(',').map(t => t.trim()).filter(t => t);

      let tableHTML = `<table class="matrix-table"><thead><tr><th>Color / Talle</th>`;
      talles.forEach(t => tableHTML += `<th>${t}</th>`);
      tableHTML += `</tr></thead><tbody>`;

      colores.forEach(c => {
        tableHTML += `<tr><strong><td>${c}</td></strong>`;
        talles.forEach(t => {
          tableHTML += `<td><input type="number" min="0" value="0" data-color="${c}" data-talle="${t}" class="matrix-input"></td>`;
        });
        tableHTML += `</tr>`;
      });

      tableHTML += `</tbody></table>`;
      document.getElementById('matrixContainer').innerHTML = tableHTML;
      document.getElementById('btnSaveProduct').style.display = 'inline-block';
    };

    const productModal = document.getElementById('productModal');
    document.getElementById('btnAdd').onclick = () => productModal.classList.add('active');
    document.getElementById('btnCancelProduct').onclick = () => {
      productModal.classList.remove('active');
      document.getElementById('productForm').reset();
      document.getElementById('matrixContainer').innerHTML = '';
      document.getElementById('btnSaveProduct').style.display = 'none';
    };

    document.getElementById('productForm').onsubmit = (e) => {
      e.preventDefault();
      
      const colores = document.getElementById('prodColores').value.split(',').map(c => c.trim()).filter(c => c);
      const talles = document.getElementById('prodTalles').value.split(',').map(t => t.trim()).filter(t => t);
      
      let stockMatrix = {};
      colores.forEach(c => stockMatrix[c] = {});

      document.querySelectorAll('.matrix-input').forEach(input => {
        const color = input.getAttribute('data-color');
        const talle = input.getAttribute('data-talle');
        const cant = parseInt(input.value) || 0;
        stockMatrix[color][talle] = cant;
      });

      const newProd = {
        id: Date.now(),
        name: document.getElementById('prodName').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        img: document.getElementById('prodImg').value,
        colores: colores,
        talles: talles,
        stockMatrix: stockMatrix
      };

      products.push(newProd);
      saveProducts();
      productModal.classList.remove('active');
      document.getElementById('productForm').reset();
      document.getElementById('matrixContainer').innerHTML = '';
      document.getElementById('btnSaveProduct').style.display = 'none';
    };

    const adminModal = document.getElementById('adminModal');
    document.getElementById('btnAdmin').onclick = () => {
      renderAdminList();
      adminModal.classList.add('active');
    };
    document.getElementById('btnCloseAdmin').onclick = () => adminModal.classList.remove('active');

    function renderAdminList() {
      const container = document.getElementById('adminStockList');
      container.innerHTML = '';

      products.forEach(p => {
        const item = document.createElement('div');
        item.style.cssText = 'border-bottom: 1px solid #e2e8f0; padding: 10px 0;';
        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
            <strong>${p.name}</strong>
            <button class="btn btn-outline" style="color:red; padding:4px 8px; font-size:0.75rem;" onclick="deleteProduct(${p.id})">Eliminar</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    window.deleteProduct = (id) => {
      if (confirm('¿Seguro que querés borrar esta prenda del catálogo?')) {
        products = products.filter(p => p.id !== id);
        saveProducts();
        renderAdminList();
      }
    };

    document.getElementById('searchInput').oninput = renderCatalog;
    saveProducts();
  </script>
</body>
</html>
